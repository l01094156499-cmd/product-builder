<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Animal Face Test - What animal do I look like?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link href='/style.css' rel='stylesheet'>
  <meta name="google-adsense-account" content="ca-pub-9789843762589982">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9789843762589982"
     crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script>
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.addEventListener('DOMContentLoaded', () => {
          document.body.classList.add('dark-mode');
        });
      }
    })();
  </script>
</head>
<body>
  <div class="controls-container">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <span class="icon">🌓</span>
      <span class="text">Theme</span>
    </button>
    <a href="/index.html" class="lang-link" style="text-decoration: none; color: inherit; background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 15px; border-radius: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: var(--card-shadow); backdrop-filter: blur(10px);">
      <span class="icon">🇰🇷</span>
      <span class="text">한국어</span>
    </a>
  </div>
  
  <main>
    <section class="test-container">
      <h1 class="title">AI Animal Face Test</h1>
      <h2 class="subtitle">Find out which animal you look like with AI</h2>
      
      <div id="upload-container" class="upload-area">
        <input type="file" id="image-upload" accept="image/*" style="display: none;">
        <label for="image-upload" class="upload-label">
          <div class="upload-icon">📸</div>
          <p>Upload or take a photo</p>
        </label>
      </div>

      <div id="loading" class="loading-spinner" style="display: none;">
        <div class="spinner"></div>
        <p>AI is analyzing...</p>
      </div>

      <div id="result-container" style="display: none;">
        <img id="face-image" src="#" alt="your face" class="preview-image">
        <div id="result-message" class="result-message"></div>
        <div id="label-container" class="label-container"></div>
        <button onclick="window.location.reload()" class="retry-btn">Try Again</button>
      </div>
    </section>
    
    <section class="comment-section">
      <h3>💬 Share your results!</h3>
      <div id="disqus_thread"></div>
      <script>
          var disqus_config = function () {
              this.page.url = window.location.href;
              this.page.identifier = window.location.pathname;
          };
          (function() {
              var d = document, s = d.createElement('script');
              s.src = 'https://productbuilder-hgp8ap1qzn.disqus.com/embed.js';
              s.setAttribute('data-timestamp', +new Date());
              (d.head || d.body).appendChild(s);
          })();
      </script>
    </section>

    <section class="contact-section">
      <h3>🤝 Partnership Inquiry</h3>
      <p>Please leave your business proposals or inquiries.</p>
      <form action="https://formspree.io/f/maqakqnq" method="POST" class="contact-form">
        <div class="form-group">
          <input type="text" name="name" placeholder="Name/Company" required>
        </div>
        <div class="form-group">
          <input type="email" name="_replyto" placeholder="Email Address" required>
        </div>
        <div class="form-group">
          <textarea name="message" placeholder="Message" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </section>
  </main>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
