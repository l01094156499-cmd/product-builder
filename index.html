<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 먹지? - 저녁 메뉴 추천</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link href='/style.css' rel='stylesheet'>
  <script>
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.addEventListener('DOMContentLoaded', () => {
          document.body.classList.add('dark-mode');
        });
      }
    })();
  </script>
</head>
<body>
  <div class="controls-container">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <span class="icon">🌓</span>
      <span class="text">테마 변경</span>
    </button>
    <a href="/index_en.html" class="lang-link">
      <span class="icon">🇺🇸</span>
      <span class="text">English</span>
    </a>
  </div>
  
  <main>
    <menu-recommender></menu-recommender>
    
    <section class="comment-section">
      <h3>💬 메뉴에 대해 이야기해봐요!</h3>
      <div id="disqus_thread"></div>
      <script>
          var disqus_config = function () {
              this.page.url = window.location.href;
              this.page.identifier = window.location.pathname;
          };
          (function() {
              var d = document, s = d.createElement('script');
              s.src = 'https://product-builder-1.disqus.com/embed.js';
              s.setAttribute('data-timestamp', +new Date());
              (d.head || d.body).appendChild(s);
          })();
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </section>

    <section class="contact-section">
      <h3>🤝 제휴 및 협업 문의</h3>
      <p>비즈니스 제휴 제안이나 문의사항을 남겨주세요.</p>
      <form action="https://formspree.io/f/maqakqnq" method="POST" class="contact-form">
        <div class="form-group">
          <input type="text" name="name" placeholder="성함/업체명" required>
        </div>
        <div class="form-group">
          <input type="email" name="_replyto" placeholder="이메일 주소" required>
        </div>
        <div class="form-group">
          <textarea name="message" placeholder="문의 내용" required></textarea>
        </div>
        <button type="submit" class="submit-btn">문의 보내기</button>
      </form>
    </section>
  </main>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
