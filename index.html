<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인공지능 동물상 테스트 - 나는 어떤 동물일까?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link href='/style.css' rel='stylesheet'>
  <meta name="google-adsense-account" content="ca-pub-9789843762589982">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9789843762589982"
     crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script>
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.addEventListener('DOMContentLoaded', () => {
          document.body.classList.add('dark-mode');
        });
      }
    })();
  </script>
</head>
<body>
  <div class="controls-container">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <span class="icon">🌓</span>
      <span class="text">테마 변경</span>
    </button>
  </div>
  
  <main>
    <section class="test-container">
      <h1 class="title">인공지능 동물상 테스트</h1>
      <h2 class="subtitle">얼굴로 보는 인공지능 동물상 테스트</h2>
      
      <div id="upload-container" class="upload-area">
        <input type="file" id="image-upload" accept="image/*" style="display: none;">
        <label for="image-upload" class="upload-label">
          <div class="upload-icon">📸</div>
          <p>사진을 업로드하여 테스트 시작</p>
          <span class="upload-hint">(얼굴이 잘 나온 사진을 선택해주세요)</span>
        </label>
      </div>

      <div id="loading" class="loading-spinner" style="display: none;">
        <div class="spinner"></div>
        <p>인공지능이 관상을 분석 중입니다...</p>
      </div>

      <div id="result-container" style="display: none;">
        <div class="image-wrapper">
          <img id="face-image" src="#" alt="your face" class="preview-image">
        </div>
        <div id="result-message" class="result-message"></div>
        <div id="label-container" class="label-container"></div>
        <button onclick="window.location.reload()" class="retry-btn">다른 사진으로 하기</button>
      </div>
    </section>
    
    <section class="comment-section">
      <h3>💬 테스트 결과를 공유해봐요!</h3>
      <div id="disqus_thread"></div>
      <script>
          var disqus_config = function () {
              this.page.url = window.location.href;
              this.page.identifier = window.location.pathname;
          };
          (function() {
              var d = document, s = d.createElement('script');
              s.src = 'https://productbuilder-hgp8ap1qzn.disqus.com/embed.js';
              s.setAttribute('data-timestamp', +new Date());
              (d.head || d.body).appendChild(s);
          })();
      </script>
    </section>

    <section class="contact-section">
      <h3>🤝 제휴 및 협업 문의</h3>
      <p>비즈니스 제휴 제안이나 문의사항을 남겨주세요.</p>
      <form action="https://formspree.io/f/maqakqnq" method="POST" class="contact-form">
        <div class="form-group">
          <input type="text" name="name" placeholder="성함/업체명" required>
        </div>
        <div class="form-group">
          <input type="email" name="_replyto" placeholder="이메일 주소" required>
        </div>
        <div class="form-group">
          <textarea name="message" placeholder="문의 내용" required></textarea>
        </div>
        <button type="submit" class="submit-btn">문의 보내기</button>
      </form>
    </section>
  </main>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
